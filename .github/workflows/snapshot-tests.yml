name: Safe snapshot tests
on:
  push:
  pull_request:
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/snapshot.test.mjs
      - run: node tools/snapshot-cli.mjs benchmarks/fixtures/snapshot-demo .local-snapshots
